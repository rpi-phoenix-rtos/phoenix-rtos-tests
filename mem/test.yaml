test:
  tests:
    - name: mmap
      type: unity
      execute: test_mmap_new

    - name: mmap-demand-zero
      type: unity
      execute: test-mmap-demand-zero
      targets:
        # anonymous memory is demand-zeroed on MMU architectures only
        exclude: [
          armv7m7-imxrt106x-evk,
          armv7m7-imxrt117x-evk,
          armv7m4-stm32l4x6-nucleo,
          armv8m33-mcxn94x-frdm,
          armv8m33-mcxn94x-frdm_cpu1,
          armv7r5f-zynqmp-qemu,
          armv8m55-stm32n6-nucleo,
          ]

    - name: objcache
      type: unity
      execute: test-objcache
      # ~0.5 GB written to and read from the filesystem, then all free memory touched
      timeout: 900
      # The cached file must be much faster to map again than to read, which a RAM root is not
      # (set OBJCACHE_DIR to a directory on a real filesystem there)
      targets:
        value: [aarch64a72-generic-rpi4b]

    - name: mprotect-fault
      harness: fault_harness.py
      execute: test-mprotect-fault
      ignore: True #issue #1010 https://github.com/phoenix-rtos/phoenix-rtos-project/issues/1010
      targets:
        # mprotect: is noop on NOMMU architecture
        exclude: [
          armv7m7-imxrt106x-evk,
          armv7m7-imxrt117x-evk,
          armv7m4-stm32l4x6-nucleo,
          armv8m33-mcxn94x-frdm,
          armv8m33-mcxn94x-frdm_cpu1,
          armv7r5f-zynqmp-qemu,
          armv8m55-stm32n6-nucleo,
          ]

    - name: mprotect
      type: unity
      execute: test-mprotect
      # FIXME: this reboot is placed here as after mprotect-fault is run target need to be rebooter.
      # Currently rebooting after the test is not implemented in the runner.
      reboot: True
      targets:
        # mprotect: is noop on NOMMU architecture
        exclude: [
          armv7m7-imxrt106x-evk,
          armv7m7-imxrt117x-evk,
          armv7m4-stm32l4x6-nucleo,
          armv8m33-mcxn94x-frdm,
          armv8m33-mcxn94x-frdm_cpu1,
          armv7r5f-zynqmp-qemu,
          armv8m55-stm32n6-nucleo,
          ]
