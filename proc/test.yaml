test:
    tests:
        - name: test_thread_rand
          type: unity
          execute: test_thread_rand

        - name: test_priority
          load:
            - app: test_priority
          harness: test_priority.py

        - name: msg_abandon
          type: unity
          execute: test-msg-abandon
          targets:
            # Excluded due to lack of fork() on NOMMU targets
            exclude: [
              armv7m7-imxrt106x-evk,
              armv7m7-imxrt117x-evk,
              armv7m4-stm32l4x6-nucleo,
              armv8m33-mcxn94x-frdm,
              armv8m33-mcxn94x-frdm_cpu1,
              armv7r5f-zynqmp-qemu,
              armv8m55-stm32n6-nucleo
              ]
